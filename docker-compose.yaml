version: "3.8"

#version: "3"
services:
  smartbench_gen:
    container_name: smartbench_gen
    build:
      context: ./
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./benchmark:/home/smart_benchmark/benchmark
    command:
      - /bin/bash
      - -c
      - |
        python3 python/generate.py